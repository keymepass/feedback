name: Bug report
description: Something isn't working
labels: ["bug"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS
        - Android
        - HarmonyOS
        - Browser extension
        - macOS
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "1.3.4"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS version
      placeholder: "Pixel 6a, Android 15"
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what happened instead
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: markdown
    attributes:
      value: |
        **Don't paste passwords, recovery keys, or screenshots containing
        your vault contents.** This issue is public.
