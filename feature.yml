name: Feature request
description: Suggest something
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve
      description: What are you trying to do that's hard today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
  - type: dropdown
    id: platform
    attributes:
      label: Which platform
      multiple: true
      options:
        - iOS
        - Android
        - HarmonyOS
        - Browser extension
        - macOS
        - All
